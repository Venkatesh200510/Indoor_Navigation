name: indoor_navigation
description: Scanner-Based Adaptive Indoor Navigation System
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0               # HTTP requests to backend
  mobile_scanner: ^5.0.0     # Camera QR code reader
  flutter_tts: ^4.0.2        # Text-to-speech voice directions
  provider: ^6.1.1           # State management
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

